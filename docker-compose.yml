services:
  rabbitmq:
    image: rabbitmq:4.2.6-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/
      - rabbitmq-logs:/var/log/rabbitmq/
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4.7
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  fraud-engine:
    build:
      context: ./services/fraud-engine
      dockerfile: Dockerfile
    container_name: fraud-engine
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment-gateway:
    build:
      context: ./services/payment-gateway
      dockerfile: Dockerfile
      target: dev
    container_name: payment-gateway
    environment:
      APP_ENV: dev
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    volumes:
      - ./services/payment-gateway/:/app/
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy

  notification-manager:
    build:
      context: ./services/notification-manager
      dockerfile: Dockerfile
      target: dev
    container_name: notification-manager
    restart: unless-stopped
    environment:
      APP_ENV: dev
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      MAILER_DSN: smtp://mailpit:1025
    volumes:
      - ./services/notification-manager/:/app/
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  payment-gateway-nginx:
    image: nginx:1.27-alpine
    container_name: payment-gateway-nginx
    ports:
      - "8080:80"
    volumes:
      - ./services/payment-gateway/:/app/:ro
      - ./docker/nginx/payment-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - payment-gateway

volumes:
  mysql_data:
    driver: local
  rabbitmq-data:
    driver: local
  rabbitmq-logs:
    driver: local
  mailpit-data:
    driver: local
